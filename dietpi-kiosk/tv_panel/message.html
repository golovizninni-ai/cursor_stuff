<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12151a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TV пульт">
<title>TV сообщение</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
:root {
  --bg: #12151a;
  --panel: #1a1f27;
  --btn: #2a3140;
  --text: #e8eef5;
  --muted: #8b97a8;
  --accent: #5b9fd4;
  --danger: #c45c5c;
  --ok: #5aa879;
  --w: 300px;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  background: var(--bg); color: var(--text);
  font-family: "Segoe UI", system-ui, sans-serif;
  display: flex; flex-direction: column; align-items: center;
  padding: .5rem;
}
nav, #status, .card { width: min(var(--w), 100%); }
nav {
  display: flex; gap: .4rem; margin-bottom: .45rem;
}
nav a {
  flex: 1; text-align: center; text-decoration: none;
  color: var(--muted); padding: .35rem; border-radius: 6px;
  background: var(--panel); font-size: .8rem;
}
nav a.active { color: var(--text); outline: 1px solid var(--accent); }
#status {
  font-size: .75rem; color: var(--muted);
  margin-bottom: .45rem; display: flex; justify-content: space-between;
}
#status .on { color: var(--ok); }
#status .off { color: var(--danger); }
.card {
  background: var(--panel);
  border-radius: 10px; padding: .55rem;
}
label {
  display: block; font-size: .75rem; color: var(--muted);
  margin: .45rem 0 .2rem;
}
label:first-of-type { margin-top: 0; }
input, textarea {
  width: 100%; border: 0; border-radius: 6px;
  background: #12151a; color: var(--text);
  padding: .45rem .55rem; font: inherit; font-size: .85rem;
}
textarea { min-height: 4.5rem; resize: vertical; }
.hint { font-size: .7rem; color: var(--muted); margin-top: .15rem; }
.row { display: flex; gap: .35rem; margin-top: .55rem; }
button {
  flex: 1; border: 0; border-radius: 8px;
  background: var(--btn); color: var(--text);
  padding: .45rem .3rem; font-size: .85rem; cursor: pointer;
  min-height: 36px;
}
button.accent { background: #243548; color: #cfe6f8; }
button.danger { background: #3a2424; color: #f0c0c0; }
#msg { margin-top: .45rem; font-size: .75rem; color: var(--muted); min-height: 1.1em; }
</style>
</head>
<body>
<nav>
  <a href="/">Пульт</a>
  <a class="active" href="/message.html">Сообщение</a>
</nav>
<div id="status">
  <span>ADB: <b id="adb">…</b></span>
  <span>Оверлей: <b id="ov">…</b></span>
</div>

<section class="card">
  <label for="title">Плашка (можно пусто)</label>
  <input id="title" type="text" autocomplete="off" placeholder="Заголовок">

  <label for="text">Текст (можно пусто)</label>
  <textarea id="text" placeholder="Текст на ТВ"></textarea>

  <label for="sec">Секунды</label>
  <input id="sec" type="number" min="0" step="1" value="30">
  <div class="hint">0 — без таймера, снять кнопкой «Снять»</div>

  <div class="row">
    <button class="accent" type="button" id="show">Показать</button>
    <button class="danger" type="button" id="stop">Снять</button>
  </div>
  <div id="msg"></div>
</section>

<script>
async function api(path, body) {
  const opts = {
    method: body === undefined ? 'GET' : 'POST',
    credentials: 'same-origin',
  };
  if (body !== undefined) {
    opts.headers = { 'Content-Type': 'application/json' };
    opts.body = JSON.stringify(body);
  }
  const r = await fetch(path, opts);
  return r.json().catch(() => ({ ok: false }));
}

function mark(el, on, yes, no) {
  el.textContent = on ? yes : no;
  el.className = on ? 'on' : 'off';
}

async function refresh() {
  try {
    const s = await api('/api/status');
    mark(document.getElementById('adb'), !!s.adb, 'online', 'offline');
    mark(document.getElementById('ov'), !!s.message_active, 'активен', 'нет');
  } catch (_) {}
}

document.getElementById('show').addEventListener('click', async () => {
  const title = document.getElementById('title').value;
  const text = document.getElementById('text').value;
  const seconds = Number(document.getElementById('sec').value || 0);
  const msg = document.getElementById('msg');
  msg.textContent = 'Отправка…';
  const r = await api('/api/message', { title, text, seconds });
  msg.textContent = r.ok ? 'Показано на ТВ' : ('Ошибка: ' + (r.error || 'fail'));
  refresh();
});

document.getElementById('stop').addEventListener('click', async () => {
  await api('/api/message/stop', {});
  document.getElementById('msg').textContent = 'Снято, HDMI 3';
  refresh();
});

refresh();
setInterval(refresh, 5000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

if (window.matchMedia('(display-mode: standalone)').matches) {
  try { window.resizeTo(340, 720); } catch (_) {}
}
</script>
</body>
</html>
