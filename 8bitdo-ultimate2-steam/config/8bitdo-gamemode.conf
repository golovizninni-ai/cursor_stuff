# Конфиг hotkey: Guide + LT + RT -> Game Mode (Desktop).
# Копируется в ~/.config/8bitdo/gamemode.conf при install-gamemode-hotkey.sh

[hotkey]
# Порог для аналоговых курков (0–255). ~128 = половина хода.
trigger_threshold=128

# Сколько мс держать все три одновременно.
hold_ms=400

# Основная команда (ярлык «Return to Gaming Mode» на Bazzite).
switch_command=/usr/bin/return-to-gamemode

# Запасной вариант, если return-to-gamemode нет.
fallback_command=/usr/bin/steamos-session-select
