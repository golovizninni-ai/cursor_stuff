# Конфиг hotkey: Start(+) + Select(−) + LB + RB -> Game Mode (Desktop).
# Копируется в ~/.config/8bitdo/gamemode.conf при install-gamemode-hotkey.sh
# Guide/Home не используем — Steam часто перехватывает.

[hotkey]
# Сколько мс держать все четыре одновременно.
hold_ms=400

# Основная команда: wrapper (после install-bazzite44) или штатный ярлык.
switch_command=/usr/local/bin/8bitdo-switch-gamemode

# Запасной: на Bazzite 44 лучше /usr/local/bin/8bitdo-switch-gamemode
fallback_command=/usr/bin/return-to-gamemode
