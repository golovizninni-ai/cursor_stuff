# Hotkey → Game Mode (как ярлыки GameMode Monitor / TV на рабочем столе).
#
# Monitor: Start(+) + Select(−) + LB + RB  → OUTPUT_CONNECTOR=DP-1 + return-to-gamemode.service
# TV:      Start(+) + Select(−) + LT + RT  → OUTPUT_CONNECTOR=DP-3 + return-to-gamemode.service

[hotkey]
hold_ms=400

# Разъёмы (как в ваших .desktop)
monitor_connector=DP-1
tv_connector=DP-3
env_file=~/.config/environment.d/10-gamescope-session.conf

# Порог аналоговых курков (если LT/RT идут как оси, не как кнопки 312/313)
trigger_threshold=128

# Вызывается как: 8bitdo-switch-gamemode monitor|tv
switch_command=/usr/local/bin/8bitdo-switch-gamemode
