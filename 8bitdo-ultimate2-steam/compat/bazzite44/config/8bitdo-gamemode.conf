# Конфиг hotkey для Bazzite 44 (и совместимый с 43 через wrapper).
[hotkey]
trigger_threshold=128
hold_ms=400

# Умный wrapper: steamosctl → return-to-gamemode → steamos-session-select
switch_command=/usr/local/bin/8bitdo-switch-gamemode

# Запасной прямой путь
fallback_command=/usr/bin/return-to-gamemode
