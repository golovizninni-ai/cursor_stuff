# Интерактивный чат playerbots через Ollama.
# 1660 Ti 6 ГБ: qwen2.5:3b, один запрос за раз, без болтовни 200 rndbot в городе.
# После 3070 Ti 8 ГБ: MODEL=qwen2.5:7b scripts/enable-ollama-chat.sh playerbots
OllamaChat.Enable = 1
OllamaChat.DebugEnabled = 0
OllamaChat.Url = http://127.0.0.1:11434/api/generate
OllamaChat.Model = qwen2.5:3b
OllamaChat.NumPredict = 40
OllamaChat.Temperature = 0.7
OllamaChat.NumCtx = 2048
OllamaChat.MaxConcurrentQueries = 1
OllamaChat.ThinkModeEnableForModule = 0
OllamaChat.MaxBotsToPick = 1
OllamaChat.EnableWhisperReplies = 1
OllamaChat.DisableForCustomChannels = 1
OllamaChat.PlayerReplyChance.Say = 80
OllamaChat.BotReplyChance.Say = 0
OllamaChat.PlayerReplyChance.Channel = 0
OllamaChat.BotReplyChance.Channel = 0
OllamaChat.PlayerReplyChance.Party = 90
OllamaChat.BotReplyChance.Party = 0
OllamaChat.PlayerReplyChance.Guild = 40
OllamaChat.BotReplyChance.Guild = 0
OllamaChat.EnableRandomChatter = 0
OllamaChat.DisableRepliesInCombat = 1
OllamaChat.EnableEventChatter = 1
OllamaChat.EventChatterBotCommentChance = 15
OllamaChat.EventChatterMaxBotsPerPlayer = 1
OllamaChat.EnableRPPersonalities = 1
OllamaChat.EnableChatHistory = 1
OllamaChat.MaxConversationHistory = 4
OllamaChat.EnableTypingSimulation = 1
OllamaChat.SystemPrompt = "Отвечай только по-русски. Ты живой игрок World of Warcraft 3.3.5 Wrath of the Lich King. Коротко, без markdown, без эмодзи, без кавычек вокруг всей фразы."
OllamaChat.ChatPromptTemplate = "Ты игрок Wrath of the Lich King. Имя: {bot_name}, уровень {bot_level} {bot_class}. Личность: {bot_personality_name}: {bot_personality}. {sentiment_info} {chat_history} Игрок {player_name} (уровень {player_level} {player_class}) сказал: '{player_message}'. {extra_info} Ответь по-русски, естественно, не длиннее 15 слов. Без markdown и эмодзи."
OllamaChat.DefaultPersonalityPrompt = "Говори как живой игрок WotLK по-русски, коротко и по делу."
